name: Meowlett Native iOS Build

on:
  push:
    branches:
      - main
      - native-swift-parity
    paths:
      - 'ios/**'
      - 'public/meow.png'
      - 'src/**'
      - 'index.html'
      - '.github/workflows/ios-native.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ios/**'
      - 'public/meow.png'
      - '.github/workflows/ios-native.yml'

permissions:
  contents: read

# Keep only the newest native build for a branch; intermediate commits are superseded.
concurrency:
  group: meowlett-native-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Meowlett for iOS
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate app icon
        run: bash ios/Scripts/GenerateAppIcon.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml

      - name: Show schemes
        run: xcodebuild -list -project ios/Meowlett.xcodeproj

      - name: Build simulator
        run: |
          xcodebuild \
            -project ios/Meowlett.xcodeproj \
            -scheme Meowlett \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/MeowlettSimulator" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Capture native app previews
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); devices=[x for group in d["devices"].values() for x in group if x.get("isAvailable") and x.get("name","").startswith("iPhone")]; booted=next((x for x in devices if x.get("state")=="Booted"),None); chosen=booted or next((x for x in devices if x.get("state")=="Shutdown"),None); print(chosen["udid"] if chosen else "")')"
          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone Simulator found."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Simulator selected: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          echo "Waiting for Simulator boot..."
          timeout 180 xcrun simctl bootstatus "$DEVICE_ID" -b
          echo "Simulator booted."
          APP_PATH="$RUNNER_TEMP/MeowlettSimulator/Build/Products/Debug-iphonesimulator/Meowlett.app"
          test -d "$APP_PATH"
          echo "Installing Meowlett app..."
          timeout 90 xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/MeowlettPreviews"
          echo "Capturing onboarding preview..."
          timeout 60 xcrun simctl launch "$DEVICE_ID" com.mwlt.meowlett
          sleep 3
          timeout 30 xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/MeowlettPreviews/01-onboarding.png"
          xcrun simctl terminate "$DEVICE_ID" com.mwlt.meowlett || true
          xcrun simctl spawn "$DEVICE_ID" defaults write com.mwlt.meowlett mwlt.native.onboarded -bool YES
          echo "Capturing dashboard preview..."
          timeout 60 xcrun simctl launch "$DEVICE_ID" com.mwlt.meowlett --mwlt-preview-seed-data
          sleep 3
          timeout 30 xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/MeowlettPreviews/02-dashboard.png"

          # Capture every top-level native tab with representative, simulator-only data.
          for TAB in transactions report date settings; do
            xcrun simctl terminate "$DEVICE_ID" com.mwlt.meowlett || true
            echo "Capturing $TAB preview..."
            timeout 60 xcrun simctl launch "$DEVICE_ID" com.mwlt.meowlett --mwlt-preview-seed-data "--mwlt-preview-tab=$TAB"
            sleep 2
            timeout 30 xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/MeowlettPreviews/03-$TAB.png"
          done

          # Capture the native quick-add sheet as a separate preview state.
          xcrun simctl terminate "$DEVICE_ID" com.mwlt.meowlett || true
          echo "Capturing quick-add preview..."
          timeout 60 xcrun simctl launch "$DEVICE_ID" com.mwlt.meowlett --mwlt-preview-seed-data --mwlt-preview-quick-add
          sleep 2
          timeout 30 xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/MeowlettPreviews/08-quick-add.png"
          echo "All native previews captured:"
          ls -lh "$RUNNER_TEMP/MeowlettPreviews"

      - name: Upload native app previews
        uses: actions/upload-artifact@v4
        with:
          name: Meowlett-Native-Previews
          path: ${{ runner.temp }}/MeowlettPreviews/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Build iPhone device
        run: |
          xcodebuild \
            -project ios/Meowlett.xcodeproj \
            -scheme Meowlett \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/MeowlettDevice" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/MeowlettDevice/Build/Products/Release-iphoneos/Meowlett.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/MeowlettIPA/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/MeowlettIPA/Payload/Meowlett.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/MeowlettIPA/Payload" \
            "$GITHUB_WORKSPACE/Meowlett-Swift-unsigned.ipa"
          unzip -l "$GITHUB_WORKSPACE/Meowlett-Swift-unsigned.ipa" | grep 'Payload/Meowlett.app/Info.plist'

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Meowlett-Swift-unsigned-IPA
          path: Meowlett-Swift-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
