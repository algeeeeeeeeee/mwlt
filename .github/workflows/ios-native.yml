name: Meowlett Native iOS Build

on:
  push:
    branches:
      - main
      - native-swift-parity
    paths:
      - 'ios/**'
      - 'public/meow.png'
      - 'src/**'
      - 'index.html'
      - '.github/workflows/ios-native.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ios/**'
      - 'public/meow.png'
      - '.github/workflows/ios-native.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Meowlett for iOS
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate app icon
        run: bash ios/Scripts/GenerateAppIcon.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml

      - name: Show schemes
        run: xcodebuild -list -project ios/Meowlett.xcodeproj

      - name: Build simulator
        run: |
          xcodebuild \
            -project ios/Meowlett.xcodeproj \
            -scheme Meowlett \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/MeowlettSimulator" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build iPhone device
        run: |
          xcodebuild \
            -project ios/Meowlett.xcodeproj \
            -scheme Meowlett \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/MeowlettDevice" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/MeowlettDevice/Build/Products/Release-iphoneos/Meowlett.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/MeowlettIPA/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/MeowlettIPA/Payload/Meowlett.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/MeowlettIPA/Payload" \
            "$GITHUB_WORKSPACE/Meowlett-Swift-unsigned.ipa"
          unzip -l "$GITHUB_WORKSPACE/Meowlett-Swift-unsigned.ipa" | grep 'Payload/Meowlett.app/Info.plist'

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Meowlett-Swift-unsigned-IPA
          path: Meowlett-Swift-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
