name: Meowlett Native iOS Build

on:
  push:
    branches:
      - main
      - native-swift-parity
    paths:
      - 'ios/**'
      - 'public/meow.png'
      - 'src/**'
      - 'index.html'
      - '.github/workflows/ios-native.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ios/**'
      - 'public/meow.png'
      - '.github/workflows/ios-native.yml'

permissions:
  contents: read

# Keep only the newest native build for a branch; intermediate commits are superseded.
concurrency:
  group: meowlett-native-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Meowlett for iOS
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate app icon
        run: bash ios/Scripts/GenerateAppIcon.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml

      - name: Show schemes
        run: xcodebuild -list -project ios/Meowlett.xcodeproj

      - name: Build simulator
        run: |
          xcodebuild \
            -project ios/Meowlett.xcodeproj \
            -scheme Meowlett \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/MeowlettSimulator" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Capture native app previews
        run: |
          set -euo pipefail

          # Create a brand-new full-size simulator. Reusing a previously resized
          # simulator can produce a short, window-like screenshot with black bars.
          SIM_SELECTION="$(python3 -c '
          import json, subprocess, sys, re

          def simctl_json(*args):
              result = subprocess.run(
                  ["xcrun", "simctl", "list", *args, "-j"],
                  check=True, text=True, capture_output=True
              )
              return json.loads(result.stdout)

          types = simctl_json("devicetypes").get("devicetypes", [])
          runtimes = simctl_json("runtimes").get("runtimes", [])
          ios_runtimes = [
              runtime for runtime in runtimes
              if runtime.get("isAvailable") and runtime.get("platform") == "iOS"
          ]
          if not ios_runtimes:
              raise SystemExit("No available iOS Simulator runtime.")

          def version(value):
              return tuple(int(part) for part in re.findall(r"[0-9]+", str(value or "0")))

          runtime = max(ios_runtimes, key=lambda item: version(item.get("version")))
          available = [
              item for item in types
              if item.get("identifier", "").startswith("com.apple.CoreSimulator.SimDeviceType.iPhone")
          ]

          priorities = [
              "iPhone XR", "iPhone 11", "iPhone 11 Pro", "iPhone 12",
              "iPhone 13", "iPhone 14", "iPhone SE (3rd generation)",
              "iPhone 15", "iPhone 16e", "iPhone 16", "iPhone 16 Pro"
          ]
          ordered = []
          for name in priorities:
              candidate = next((item for item in available if item.get("name") == name), None)
              if candidate and candidate not in ordered:
                  ordered.append(candidate)
          ordered.extend(item for item in available if item not in ordered)

          errors = []
          for candidate in ordered:
              attempt = subprocess.run(
                  ["xcrun", "simctl", "create",
                   "MeowlettPreview-" + candidate["name"].replace(" ", ""),
                   candidate["identifier"], runtime["identifier"]],
                  text=True, capture_output=True
              )
              if attempt.returncode == 0:
                  device_id = attempt.stdout.strip()
                  print("Created Simulator: " + candidate["name"] + " / " + candidate["identifier"], file=sys.stderr)
                  print("|".join([device_id, candidate["name"], candidate["identifier"], runtime["identifier"]]))
                  break
              errors.append(candidate.get("name", "iPhone") + ": " + attempt.stderr.strip())
          else:
              names = ", ".join(item.get("name", "?") for item in available)
              raise SystemExit("Could not create an iPhone simulator. Available: " + names + ". Errors: " + " | ".join(errors))
          ')"
          DEVICE_ID="${SIM_SELECTION%%|*}"
          SIM_REST="${SIM_SELECTION#*|}"
          DEVICE_NAME="${SIM_REST%%|*}"
          SIM_REST="${SIM_REST#*|}"
          DEVICE_TYPE_ID="${SIM_REST%%|*}"
          RUNTIME_ID="${SIM_REST#*|}"
          if [ -z "$DEVICE_TYPE_ID" ] || [ -z "$RUNTIME_ID" ]; then
            echo "Could not find a standard iPhone simulator device type and iOS runtime."
            xcrun simctl list devicetypes available
            xcrun simctl list runtimes available
            exit 1
          fi

          DEVICE_ID="$(xcrun simctl create "MeowlettPreview-$GITHUB_RUN_ID" "$DEVICE_TYPE_ID" "$RUNTIME_ID")"
          cleanup_simulator() {
            xcrun simctl shutdown "$DEVICE_ID" >/dev/null 2>&1 || true
            xcrun simctl delete "$DEVICE_ID" >/dev/null 2>&1 || true
          }
          # Prevent a stuck simctl launch/screenshot from holding the macOS runner indefinitely.
          (
            sleep 720
            echo "::error::Native preview capture exceeded 12 minutes."
            kill -TERM "$PPID"
          ) &
          WATCHDOG_PID=$!
          trap 'kill "$WATCHDOG_PID" >/dev/null 2>&1 || true; cleanup_simulator' EXIT

          echo "Fresh simulator: $DEVICE_ID ($DEVICE_NAME / $DEVICE_TYPE_ID / $RUNTIME_ID)"
          perl -e 'alarm shift; exec @ARGV' 90 xcrun simctl boot "$DEVICE_ID"
          echo "Waiting for fresh Simulator boot (maximum 4 minutes)..."
          if ! perl -e 'alarm shift; exec @ARGV' 240 xcrun simctl bootstatus "$DEVICE_ID" -b; then
            echo "::error::Simulator boot did not finish within 4 minutes."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Simulator booted."
          xcrun simctl status_bar "$DEVICE_ID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100

          APP_PATH="$RUNNER_TEMP/MeowlettSimulator/Build/Products/Debug-iphonesimulator/Meowlett.app"
          test -d "$APP_PATH"
          echo "Installing Meowlett app..."
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/MeowlettPreviews"

          echo "Capturing onboarding preview..."
          xcrun simctl launch "$DEVICE_ID" com.mwlt.meowlett
          sleep 3
          xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/MeowlettPreviews/01-onboarding.png"
          xcrun simctl terminate "$DEVICE_ID" com.mwlt.meowlett || true
          xcrun simctl spawn "$DEVICE_ID" defaults write com.mwlt.meowlett mwlt.native.onboarded -bool YES

          echo "Capturing dashboard preview..."
          xcrun simctl launch "$DEVICE_ID" com.mwlt.meowlett --mwlt-preview-seed-data
          sleep 3
          xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/MeowlettPreviews/02-dashboard.png"

          # Capture every top-level native tab with representative simulator-only data.
          for TAB in transactions report date settings; do
            xcrun simctl terminate "$DEVICE_ID" com.mwlt.meowlett || true
            echo "Capturing $TAB preview..."
            xcrun simctl launch "$DEVICE_ID" com.mwlt.meowlett --mwlt-preview-seed-data "--mwlt-preview-tab=$TAB"
            sleep 2
            xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/MeowlettPreviews/03-$TAB.png"
          done

          # Capture the native quick-add sheet as a separate preview state.
          xcrun simctl terminate "$DEVICE_ID" com.mwlt.meowlett || true
          echo "Capturing quick-add preview..."
          xcrun simctl launch "$DEVICE_ID" com.mwlt.meowlett --mwlt-preview-seed-data --mwlt-preview-quick-add
          sleep 2
          xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/MeowlettPreviews/08-quick-add.png"

          echo "All native previews captured:"
          ls -lh "$RUNNER_TEMP/MeowlettPreviews"

      - name: Upload native app previews
        uses: actions/upload-artifact@v4
        with:
          name: Meowlett-Native-Previews
          path: ${{ runner.temp }}/MeowlettPreviews/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Build iPhone device
        run: |
          xcodebuild \
            -project ios/Meowlett.xcodeproj \
            -scheme Meowlett \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/MeowlettDevice" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/MeowlettDevice/Build/Products/Release-iphoneos/Meowlett.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/MeowlettIPA/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/MeowlettIPA/Payload/Meowlett.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/MeowlettIPA/Payload" \
            "$GITHUB_WORKSPACE/Meowlett-Swift-unsigned.ipa"
          unzip -l "$GITHUB_WORKSPACE/Meowlett-Swift-unsigned.ipa" | grep 'Payload/Meowlett.app/Info.plist'

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Meowlett-Swift-unsigned-IPA
          path: Meowlett-Swift-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
